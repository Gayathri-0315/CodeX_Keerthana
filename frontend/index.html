<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Events that fit your week. ShowUp helps you show up." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230071E3'/%3E%3Cpath d='M10 16.5l4 4 8-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>ShowUp</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try { var t = localStorage.getItem("showup-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
      // Start the first API calls while the app's JS is still downloading (src/lib/api.ts picks them up).
      (function () {
        var boot = (window.__boot = {});
        var get = function (p) { return (boot[p] = fetch("/api" + p, { credentials: "same-origin" })); };
        var path = location.pathname;
        var first = { "/": ["/feed/count", "/feed?tab=for_you&limit=20"], "/calendar": ["/availability", "/feed/count"], "/my": ["/registrations/me"] }[path];
        get("/auth/session").then(function (r) { return r.clone().json(); }).then(function (d) {
          if (d && d.user && d.user.role === "student" && d.user.onboarded && first) first.forEach(get);
        }).catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
